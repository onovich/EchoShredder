<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="EchoShredder：把烦恼丢进赛博碎纸机，留下一句冷静回响。" />
  <title>EchoShredder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="background-glow" aria-hidden="true"></div>

  <main class="app-shell" data-phase="input">
    <header class="brand" aria-label="EchoShredder 标题">
      <div class="brand-row">
        <span class="icon">✂</span>
        <span class="brand-text">EMOTIONAL SHREDDER</span>
      </div>
      <h1>EchoShredder</h1>
      <p>把此刻的噪声送进碎纸口，只留下可继续前行的回响。</p>
    </header>

    <section class="stage" aria-live="polite">
      <div class="note-wrap">
        <div class="note-card" id="noteCard">
          <div class="note-lines" aria-hidden="true"></div>
          <textarea
            id="inputText"
            class="note-input"
            placeholder="此刻你在烦恼什么？"
            maxlength="220"
          ></textarea>
          <div class="note-meta">
            <span>WRITE / RELEASE / ERASE</span>
            <strong id="charCount">0 / 220</strong>
          </div>
        </div>
      </div>

      <div class="machine" id="machine" aria-hidden="true">
        <div class="machine-top">
          <div class="slot">
            <div class="scan-light"></div>
          </div>
          <div class="machine-lights">
            <span class="light light-power"></span>
            <span class="light light-status"></span>
          </div>
        </div>
        <div class="machine-body"></div>
        <div class="particles" id="particles"></div>
      </div>

      <div class="result-panel hidden" id="resultPanel">
        <div class="result-card">
          <span class="result-icon">✦</span>
          <p class="result-label">碎纸回响</p>
          <h2 id="echoText">记录已抹除</h2>
        </div>
      </div>
    </section>

    <div class="controls">
      <button id="shredButton" class="primary-button" type="button" disabled>立刻粉碎</button>
      <button id="resetButton" class="ghost-button hidden" type="button">再粉碎一张</button>
    </div>

    <section class="info-panel">
      <div>
        <p class="info-label">模式</p>
        <strong>纯前端 / GitHub Pages 兼容</strong>
      </div>
      <div>
        <p class="info-label">回响生成</p>
        <strong>本地算法生成，不暴露密钥</strong>
      </div>
    </section>
  </main>

  <script type="module" src="./index.js"></script>
</body>
</html>
